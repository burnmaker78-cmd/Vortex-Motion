
name: Extract App Archive

on:
  workflow_dispatch:
    inputs:
      archive_url:
        description: "Direct download URL for an archive you own"
        required: true
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download archive
        env:
          ARCHIVE_URL: ${{ inputs.archive_url }}
        run: |
          set -e
          curl -fLsS --retry 2 \
            "$ARCHIVE_URL" \
            -o app.zip

          echo "Downloaded file information:"
          file app.zip
          ls -lh app.zip

          if ! unzip -tq app.zip; then
            echo "::error::The downloaded file is not a valid ZIP archive. Check the download URL."
            exit 1
          fi

      - name: Extract archive
        run: |
          mkdir -p extracted-app
          unzip -q app.zip -d archive

          APP_DIR=$(find archive/Payload \
            -maxdepth 1 -type d \
            -name '*.app' \
            -print -quit 2>/dev/null || true)

          if [ -z "$APP_DIR" ]; then
            echo "::error::No .app bundle found inside Payload."
            exit 1
          fi

          cp -R "$APP_DIR"/. extracted-app/

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add extracted-app
          git commit -m "Extract app bundle" \
            || echo "No changes to commit"
          git push
